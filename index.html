<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Expense Tracker</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg-light: #f8f9fa;
      --bg-dark: #121212;
      --card-light: #ffffff;
      --card-dark: #1e1e1e;
      --text-light: #212529;
      --text-dark: #f1f1f1;
      --primary: #b700ff;
      --danger: #dc3545;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg-light);
      color: var(--text-light);
      margin: 0;
      padding: 2rem;
      transition: background 0.3s, color 0.3s;
    }

    body.dark {
      background-color: var(--bg-dark);
      color: var(--text-dark);
    }

    .container {
      max-width: 900px;
      margin: auto;
      background-color: var(--card-light);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 0 10px var(--shadow);
      transition: background 0.3s;
    }

    body.dark .container {
      background-color: var(--card-dark);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    form {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr 1.5fr auto;
      gap: 10px;
      margin-bottom: 1rem;
    }

    input, select, button {
      padding: 8px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    #actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin: 1rem 0;
    }

    #expenseList li {
      background: var(--primary);
      color: #fff;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .actions button {
      margin-left: 5px;
      background-color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      padding: 4px 6px;
    }

    .actions button.edit { color: #9c1dd2; }
    .actions button.delete { color: var(--danger); }

    canvas {
      margin-top: 20px;
    }

    button.utility {
      background-color: #eee;
      border: 1px solid #ccc;
      color: #333;
      cursor: pointer;
      border-radius: 6px;
      padding: 8px 12px;
    }

    button.utility:hover {
      background-color: #ddd;
    }

    /* Sticky Summary */
    .sticky-summary {
      position: sticky;
      top: 0;
      z-index: 10;
      background-color: var(--card-light);
      padding: 10px 0;
      margin-bottom: 1rem;
      border-bottom: 1px solid #ddd;
    }

    body.dark .sticky-summary {
      background-color: var(--card-dark);
      border-bottom: 1px solid #444;
    }

    #controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Expense Tracker</h1>
      <button id="themeToggle">Toggle Theme</button>
    </header>

    <form id="expenseForm">
      <input type="date" id="date" required>
      <input type="text" id="desc" placeholder="Description" required>
      <input type="number" id="amount" placeholder="Amount" required>
      <select id="category">
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Utilities">Utilities</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Health">Health</option>
        <option value="Education">Education</option>
        <option value="Shopping">Shopping</option>
        <option value="Other">Other</option>
      </select>
      <button type="submit">Add</button>
    </form>

    <!-- Sticky Filters + Summary -->
    <div class="sticky-summary">
      <div id="controls">
        <select id="filterCategory">
          <option value="">All Categories</option>
          <option value="Food">Food</option>
          <option value="Travel">Travel</option>
          <option value="Utilities">Utilities</option>
          <option value="Entertainment">Entertainment</option>
          <option value="Health">Health</option>
          <option value="Education">Education</option>
          <option value="Shopping">Shopping</option>
          <option value="Other">Other</option>
        </select>
        <input type="date" id="fromDate">
        <input type="date" id="toDate">
        <select id="sortBy">
          <option value="date">Sort by Date</option>
          <option value="amount">Sort by Amount</option>
          <option value="category">Sort by Category</option>
        </select>
      </div>
      <p><strong>Monthly Total:</strong> ₹<span id="monthlyTotal">0.00</span></p>
    </div>

    <div id="actions">
      <button class="utility" onclick="exportToCSV()">Export CSV</button>
      <button class="utility" onclick="exportToJSON()">Export JSON</button>
      <button class="utility" onclick="clearAll()">Clear All Data</button>
    </div>

    <ul id="expenseList"></ul>
    <canvas id="expenseChart"></canvas>
  </div>

  <script>
    const form = document.getElementById('expenseForm');
    const list = document.getElementById('expenseList');
    const monthlyTotal = document.getElementById('monthlyTotal');
    const themeToggle = document.getElementById('themeToggle');
    const ctx = document.getElementById('expenseChart').getContext('2d');

    const filterCategory = document.getElementById('filterCategory');
    const fromDate = document.getElementById('fromDate');
    const toDate = document.getElementById('toDate');
    const sortBy = document.getElementById('sortBy');

    let expenses = JSON.parse(localStorage.getItem('expenses')) || [];
    let chart;
    let editIndex = null;

    function saveExpenses() {
      localStorage.setItem('expenses', JSON.stringify(expenses));
    }

    function updateChart(filtered) {
      const categoryTotals = {};
      filtered.forEach(exp => {
        categoryTotals[exp.category] = (categoryTotals[exp.category] || 0) + parseFloat(exp.amount);
      });

      const data = {
        labels: Object.keys(categoryTotals),
        datasets: [{
          data: Object.values(categoryTotals),
          backgroundColor: ['#f94144', '#f3722c', '#43aa8b', '#577590', '#8e44ad', '#16a085', '#f39c12', '#2c3e50']
        }]
      };

      if (chart) chart.destroy();
      chart = new Chart(ctx, {
        type: 'pie',
        data: data
      });
    }

    function filterAndSortExpenses() {
      let filtered = [...expenses];

      if (filterCategory.value) {
        filtered = filtered.filter(e => e.category === filterCategory.value);
      }

      if (fromDate.value) {
        filtered = filtered.filter(e => new Date(e.date) >= new Date(fromDate.value));
      }

      if (toDate.value) {
        filtered = filtered.filter(e => new Date(e.date) <= new Date(toDate.value));
      }

      if (sortBy.value === "amount") {
        filtered.sort((a, b) => b.amount - a.amount);
      } else if (sortBy.value === "category") {
        filtered.sort((a, b) => a.category.localeCompare(b.category));
      } else {
        filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
      }

      return filtered;
    }

    function renderExpenses() {
      list.innerHTML = '';
      const filtered = filterAndSortExpenses();
      let total = 0;

      filtered.forEach((exp, index) => {
        total += parseFloat(exp.amount);
        const li = document.createElement('li');
        li.innerHTML = `
          ${exp.date} - ${exp.desc} - ₹${exp.amount} <em>(${exp.category})</em>
          <span class="actions">
            <button class="edit" onclick="editExpense(${index})">✏️</button>
            <button class="delete" onclick="deleteExpense(${index})">🗑</button>
          </span>
        `;
        list.appendChild(li);
      });

      monthlyTotal.textContent = total.toFixed(2);
      updateChart(filtered);
    }

    function deleteExpense(index) {
      expenses.splice(index, 1);
      saveExpenses();
      renderExpenses();
    }

    function editExpense(index) {
      const exp = expenses[index];
      document.getElementById('date').value = exp.date;
      document.getElementById('desc').value = exp.desc;
      document.getElementById('amount').value = exp.amount;
      document.getElementById('category').value = exp.category;
      editIndex = index;
    }

    function exportToCSV() {
      let csv = 'Date,Description,Amount,Category\n';
      expenses.forEach(exp => {
        csv += `${exp.date},${exp.desc},${exp.amount},${exp.category}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'expenses.csv';
      a.click();
    }

    function exportToJSON() {
      const blob = new Blob([JSON.stringify(expenses, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'expenses.json';
      a.click();
    }

    function clearAll() {
      if (confirm("Are you sure you want to clear all data?")) {
        expenses = [];
        saveExpenses();
        renderExpenses();
      }
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const exp = {
        date: form.date.value,
        desc: form.desc.value,
        amount: parseFloat(form.amount.value),
        category: form.category.value
      };

      if (editIndex !== null) {
        expenses[editIndex] = exp;
        editIndex = null;
      } else {
        expenses.push(exp);
      }

      saveExpenses();
      form.reset();
      renderExpenses();
    });

    [filterCategory, fromDate, toDate, sortBy].forEach(el =>
      el.addEventListener('change', renderExpenses)
    );

    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });

    renderExpenses();
  </script>
</body>
</html>
